<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>額冷的Paisu V7.9 Dream-Enhanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { gold: '#fbbf24' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com');
        body {
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-body: #fff5f7;
            --card-bg: white;
            --card-border: #fce7f3;
            --text-main: #334155;
        }
        .dark {
            --bg-body: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f1f5f9;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
        }
        .glass-card {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .privacy-active .amount-val {
            position: relative;
            color: transparent !important;
            text-shadow: 0 0 10px rgba(148, 163, 184, 0.8);
            pointer-events: none;
        }
        .privacy-active .amount-val::before {
            content: '****';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-main);
            text-shadow: none;
            letter-spacing: 2px;
            font-weight: 900;
        }
        .dark.privacy-active .amount-val::before { color: #fbbf24; }
        .btn-pink {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            font-weight: 900;
        }
        .dark .btn-pink {
            background: linear-gradient(135deg, #b45309 0%, #fbbf24 100%);
            color: #451a03;
        }
        .btn-action {
            background: #fdf2f8;
            border: 1.5px dashed #f472b6;
            color: #db2777;
        }
        .dark .btn-action {
            background: #1e293b;
            border: 1.5px dashed #fbbf24;
            color: #fbbf24;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            height: 75px;
            display: flex;
            align-items: center;
            border-top: 1px solid var(--card-border);
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: 0.3s;
        }
        .nav-item.active { color: #f472b6; }
        .dark .nav-item.active { color: #fbbf24; }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 0.75rem;
            position: relative;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .calendar-day.has-data::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 4px;
            height: 4px;
            background: #f472b6;
            border-radius: 50%;
        }
        .calendar-day.selected {
            background: #f472b6 !important;
            color: white !important;
        }
        .dark .calendar-day.selected {
            background: #fbbf24 !important;
            color: #0f172a !important;
        }
    </style>
</head>
<body class="p-4">
<div class="max-w-4xl mx-auto pb-28">
    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 id="main-title" class="text-2xl font-black text-pink-500 dark:text-gold tracking-tighter">💎 額冷的paisu</h1>
            <p class="text-xs text-slate-400 dark:text-slate-300 font-bold">小資產大夢想 ‧ V7.9</p>
        </div>
        <div class="text-right">
            <div class="flex items-center justify-end gap-1 mb-1">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Net Worth</p>
                <button onclick="togglePrivacy()" id="privacy-btn" class="text-sm">👁️</button>
            </div>
            <p id="total-net-worth" class="text-xl font-black text-slate-700 dark:text-white amount-val">$ 0</p>
        </div>
    </header>

    <main>
        <section id="tab-home" class="space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-black text-pink-500 dark:text-gold text-sm">📈 投資市值</h2>
                    <a href="https://docs.google.com/spreadsheets/d/1sSJsUmdTPTF4Wh9hcGO0p-5hMSrbPCgGBhnBYR-Z2PQ/edit?usp=sharing" target="_blank" class="text-[10px] bg-slate-50 dark:bg-slate-700 text-slate-400 dark:text-slate-200 px-2 py-1 rounded-md font-bold">更新股數</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-[10px] text-left">
                        <thead>
                            <tr class="text-slate-400 dark:text-slate-300 border-b border-pink-50 dark:border-slate-700">
                                <th class="py-2 font-black">名稱</th>
                                <th class="py-2 font-black text-center">股數</th>
                                <th class="py-2 font-black text-right">市價</th>
                                <th class="py-2 font-black text-right">市值</th>
                            </tr>
                        </thead>
                        <tbody id="stock-list" class="dark:text-white font-bold"></tbody>
                    </table>
                </div>
                <button onclick="fetchGoogleData()" class="w-full mt-4 py-2 bg-pink-50 dark:bg-slate-700 text-pink-500 dark:text-gold rounded-xl text-[10px] font-bold">刷新行情</button>
            </div>

            <div class="glass-card p-5 bg-gradient-to-br from-white to-pink-50 dark:from-slate-800 dark:to-slate-900 border-pink-100 dark:border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-black text-pink-600 dark:text-gold text-sm italic">✨ <span id="dream-name-display">我的夢想</span></h2>
                    <span id="dream-percent" class="text-[10px] font-black text-white dark:text-slate-900 bg-pink-400 dark:bg-gold px-2.5 py-1 rounded-full">0%達成</span>
                </div>
                <div class="w-full bg-pink-100 dark:bg-slate-700 h-3 rounded-full overflow-hidden mb-3">
                    <div id="dream-bar" class="bg-gradient-to-r from-pink-300 to-rose-400 dark:from-amber-600 dark:to-gold h-full transition-all duration-700" style="width: 0%"></div>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-[9px] text-slate-400 dark:text-slate-300 font-bold uppercase">夢想帳戶餘額</p>
                        <p id="dream-val" class="font-black text-slate-700 dark:text-white text-xl leading-none amount-val">$ 0</p>
                    </div>
                    <div class="text-right text-[9px] text-slate-400 dark:text-slate-300 font-bold">
                        還差: <span id="dream-remain" class="text-pink-500 dark:text-gold amount-val">$ 0</span>
                    </div>
                </div>
            </div>
            <!-- 資產卡片區 (新增第五格：夢想帳戶) -->
            <div class="grid grid-cols-2 gap-3">
                <div class="glass-card p-4 border-l-4 border-pink-400 dark:border-gold">
                    <p class="text-[10px] text-slate-400 dark:text-slate-300 font-bold">Richart生活帳戶</p>
                    <p id="wallet-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-indigo-400">
                    <p class="text-[10px] text-indigo-400 font-bold">儲蓄帳戶(預備金)</p>
                    <p id="savings-val" class="font-black text-indigo-600 dark:text-indigo-300 amount-val">$ 0</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-yellow-400">
                    <p class="text-[10px] text-yellow-500 font-bold">交割帳戶</p>
                    <p id="brokerage-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-emerald-400">
                    <p class="text-[10px] text-emerald-500 font-bold">口袋現金</p>
                    <p id="cash-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p>
                </div>
                <div class="glass-card p-4 border-l-4 border-rose-400 col-span-2 bg-rose-50/30 dark:bg-rose-900/10">
                    <p class="text-[10px] text-rose-500 font-bold">🌈 夢想專區 </p>
                    <p id="dream-acc-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p>
                </div>
            </div>

            <!-- 記帳區 -->
            <div class="glass-card p-6 space-y-4 shadow-xl">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="quickWithdraw()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">🏧 領出來(放口袋)</button>
                    <button onclick="quickSave()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">💰 存起來(預備金)</button>
                    <button onclick="quickInvest()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">📉 放進去(交割戶)</button>
                    <button onclick="quickToDream()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold border-rose-400 text-rose-500 dark:border-gold dark:text-gold">✨ 投入夢想</button>
                </div>
                <div class="flex flex-wrap gap-1.5 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button onclick="setAcc('wallet')" id="btn-wallet" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px]">生活</button>
                    <button onclick="setAcc('savings')" id="btn-savings" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px]">儲蓄</button>
                    <button onclick="setAcc('brokerage')" id="btn-brokerage" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px]">交割</button>
                    <button onclick="setAcc('cash')" id="btn-cash" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px]">現金</button>
                    <button onclick="setAcc('dream')" id="btn-dream" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px]">夢想</button>
                </div>
                <!-- 記帳輸入區 -->
                <div class="grid grid-cols-1 gap-2">
                <!-- 新增：日期選擇器，預設為今天 -->
                <div class="px-0.5">
                    <input type="date" id="t-date" class="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-0.5 rounded-xl outline-none text-sm">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="t-desc" placeholder="項目內容" class="col-span-2 bg-slate-50 dark:bg-slate-900 dark:text-white p-4 rounded-xl outline-none text-sm">
                    <input type="number" id="t-amount" placeholder="金額" class="col-span-1 bg-slate-50 dark:bg-slate-900 dark:text-white p-4 rounded-xl outline-none text-sm">
                </div>
                <button onclick="addTrans()" class="w-full btn-pink py-4 rounded-2xl shadow-lg">紀錄入帳 / 支出</button>
            </div>
        </section>

        <!-- 分頁 2: 明細 (補回復原鍵) -->
        <section id="tab-calendar" class="hidden space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="changeMonth(-1)" class="text-pink-300 dark:text-gold font-bold p-2">◀</button>
                    <h2 id="calendar-month" class="font-black text-slate-700 dark:text-white">月曆</h2>
                    <button onclick="changeMonth(1)" class="text-pink-300 dark:text-gold font-bold p-2">▶</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 px-1">
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 dark:text-slate-300 font-black uppercase mb-1">本月實際收入</p><p id="monthly-income" class="text-lg font-black text-emerald-500 amount-val">$ 0</p></div>
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 dark:text-slate-300 font-black uppercase mb-1">本月實際支出</p><p id="monthly-expense" class="text-lg font-black text-rose-400 amount-val">$ 0</p></div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center px-2">
                    <h3 id="selected-date-label" class="font-black text-slate-700 dark:text-white text-sm">日期明細</h3>
                    <!-- 這裡就是復原按鈕 -->
                    <button onclick="undoLastAction()" class="text-[10px] text-pink-500 dark:text-gold font-bold bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full border border-pink-100 dark:border-slate-700 transition active:scale-90">↩️ 復原上一步</button>
                </div>
                <div id="day-detail-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- 分頁 3: 設定 -->
        <section id="tab-settings" class="hidden space-y-6">
            <div class="glass-card p-6 space-y-6">
                <h3 class="font-black text-slate-700 dark:text-white text-sm border-b pb-2">🎨 個人化設定</h3>
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl">
                    <span class="font-bold text-sm">深色模式</span>
                    <button onclick="toggleDarkMode()" class="w-12 h-6 bg-slate-200 dark:bg-gold rounded-full relative transition-all">
                        <div class="w-5 h-5 bg-white dark:bg-slate-900 rounded-full absolute top-0.5 left-0.5 dark:left-6.5 transition-all"></div>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-4 border-t">
                    <div class="col-span-2"><label class="text-[10px] font-bold">管家名稱</label><input type="text" id="setting-title" class="w-full bg-slate-50 dark:bg-slate-900 p-3 rounded-xl text-sm outline-none"></div>
                    <div><label class="text-[10px] font-bold">我有一個夢</label><input type="text" id="setting-dream-name" class="w-full bg-slate-50 dark:bg-slate-900 p-3 rounded-xl text-sm outline-none"></div>
                    <div><label class="text-[10px] font-bold">目標金額</label><input type="number" id="setting-dream-target" class="w-full bg-slate-50 dark:bg-slate-900 p-3 rounded-xl text-sm outline-none"></div>
                </div>
                <button onclick="updateDreamSettings(); updateSettings();" class="w-full py-3 bg-pink-500 dark:bg-gold text-white dark:text-slate-900 rounded-xl font-bold text-xs">儲存所有設定</button>
            </div>
            <div class="glass-card p-6 space-y-4">
                <h3 class="font-black text-slate-700 dark:text-white text-sm border-b dark:border-slate-700 pb-2">📥 數據安全</h3>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportData()" class="w-full py-3 bg-indigo-50 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 rounded-xl font-bold text-xs">備份資料 (複製代碼)</button>
                    <button onclick="importData()" class="w-full py-3 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold text-xs">還原資料 (貼上代碼)</button>
                    <button onclick="clearHistory()" class="w-full py-3 bg-rose-50 dark:bg-rose-950/30 text-rose-400 rounded-xl font-bold text-xs">清空所有紀錄 (歸零)</button>
                </div>
            </div>
        </section>            
    </main>

    <!-- 導覽列 -->
    <nav class="nav-bar">
        <button onclick="switchTab('home')" id="nav-home" class="nav-item active"><div class="text-xl">👛</div><span class="font-bold text-[10px]">資產</span></button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item"><div class="text-xl">📆</div><span class="font-bold text-[10px]">明細</span></button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-item"><div class="text-xl">⚙️</div><span class="font-bold text-[10px]">設定</span></button>
    </nav>
</div>
<script>
    const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbziOxOkH-JDDXJSQFSn0t4_9hVto_VhBl1SauC1AAbhaavX6HF0pg7bWi85Iv-PAPPW/exec';
    // --- 🚚 舊資料自動搬家邏輯 ---
    let storage = JSON.parse(localStorage.getItem('perfectMaster_V7_9'));
    let oldV5Data = JSON.parse(localStorage.getItem('perfectMaster_V5'));

    // 如果新系統沒資料，但發現有舊版 V5 資料，就自動搬過來
    if (!storage && oldV5Data) {
        storage = { 
            ...oldV5Data,
            dream: 0, // 幫你補上新的夢想格子
            version: "V7.9-Migrated"
        };
        localStorage.setItem('perfectMaster_V7_9', JSON.stringify(storage));
    } 

    // 如果兩邊都沒有資料，才用全新的帳本
    if (!storage) {
        storage = { 
            wallet: 0, savings: 0, brokerage: 0, cash: 0, dream: 0, trans: [], 
            customTitle: '💎 額冷的paisu', selectedAcc: 'wallet',
            dreamName: '✈️ 飛向夢想', dreamTarget: 50000, darkMode: false, isPrivacy: false
        };
    }
    // --- 搬家結束 ---

    let liveStocks = [], currentViewDate = new Date(), selectedDateStr = new Date().toLocaleDateString(), historyStack = [];

    // 確保網頁一打開，日期選擇器就預設為今天
    window.onload = function() {
        const dateInput = document.getElementById('t-date');
        if(dateInput) dateInput.valueAsDate = new Date();
    };

    function saveState() { 
        if (historyStack.length > 20) historyStack.shift(); 
        historyStack.push(JSON.stringify(storage)); 
    }
    
    function undoLastAction() {
        if (historyStack.length === 0) return alert("沒有紀錄可以復原囉！");
        storage = JSON.parse(historyStack.pop()); 
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
        alert("已成功撤回上一步操作！↩️");
    }

    if (storage.darkMode) document.documentElement.classList.add('dark');
    function applyPrivacy() {
        document.body.classList.toggle('privacy-active', storage.isPrivacy);
        document.getElementById('privacy-btn').innerText = storage.isPrivacy ? '🙈' : '👁️';
    }
    function togglePrivacy() { storage.isPrivacy = !storage.isPrivacy; applyPrivacy(); saveAndRender(); }
    function toggleDarkMode() { storage.darkMode = !storage.darkMode; document.documentElement.classList.toggle('dark'); saveAndRender(); }
    
    function switchTab(tab) {
        ['home', 'calendar', 'settings'].forEach(t => {
            document.getElementById(`tab-${t}`).classList.toggle('hidden', tab !== t);
            document.getElementById(`nav-${t}`).classList.toggle('active', t === tab);
        });
        if(tab === 'calendar') renderCalendar();
        if(tab === 'settings') {
            document.getElementById('setting-title').value = storage.customTitle;
            document.getElementById('setting-dream-name').value = storage.dreamName;
            document.getElementById('setting-dream-target').value = storage.dreamTarget;
        }
        window.scrollTo(0,0);
    }

    function updateSettings() {
        const newTitle = document.getElementById('setting-title').value;
        if(newTitle) { storage.customTitle = newTitle; saveAndRender(); }
    }
    function updateDreamSettings() {
        storage.dreamName = document.getElementById('setting-dream-name').value;
        storage.dreamTarget = parseFloat(document.getElementById('setting-dream-target').value) || 0;
        saveAndRender(); alert("設定已更新！🚀");
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const monthLabel = document.getElementById('calendar-month');
        grid.innerHTML = '';
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        monthLabel.innerText = `${year}年 ${month + 1}月`;
        const firstDay = new Date(year, month, 1).getDay(), lastDate = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
        
        let income = 0, expense = 0;
        const ignoreIcons = ['🏧', '💰', '📉', '✨']; 
        storage.trans.forEach(t => {
            const tDate = new Date(t.date);
            if(tDate.getFullYear() === year && tDate.getMonth() === month) {
                const isTransfer = ignoreIcons.some(icon => t.desc.includes(icon));
                if(!isTransfer) {
                    if(t.amount > 0) income += t.amount; else expense += Math.abs(t.amount);
                }
            }
        });
        document.getElementById('monthly-income').innerText = `$ ${income.toLocaleString()}`;
        document.getElementById('monthly-expense').innerText = `$ ${expense.toLocaleString()}`;

        for (let d = 1; d <= lastDate; d++) {
            const dateStr = new Date(year, month, d).toLocaleDateString();
            const hasData = storage.trans.some(t => t.date === dateStr);
            grid.innerHTML += `<div onclick="selectDate('${dateStr}')" class="calendar-day ${hasData ? 'has-data' : ''} ${selectedDateStr === dateStr ? 'selected' : ''}">${d}</div>`;
        }
        renderDayDetail(selectedDateStr);
    }

    function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); }
    function renderDayDetail(dateStr) {
        const list = document.getElementById('day-detail-list');
        // 過濾出選取日期的帳目，並記下原始索引
        const dayTrans = storage.trans.map((t, idx) => ({...t, originalIndex: idx})).filter(t => t.date === dateStr);
        
        list.innerHTML = dayTrans.length === 0 ? 
            `<div class="glass-card p-10 text-center text-slate-400 text-xs font-bold">🍵 休息日</div>` : 
            dayTrans.reverse().map(t => `
            <div class="glass-card p-4 flex justify-between items-center transition active:bg-slate-50 dark:active:bg-slate-800">
                <div class="flex items-center gap-3">
                    <!-- 帳戶縮寫圓圈 -->
                    <div class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-[9px] font-black text-slate-400 uppercase">
                        ${t.acc.substring(0,1)}
                    </div>
                    <div>
                        <p class="font-bold text-xs text-slate-600 dark:text-slate-100">${t.desc}</p>
                        <p class="text-[9px] text-slate-300 font-black uppercase">${t.acc}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <!-- 金額顯示 -->
                    <span class="font-black text-sm amount-val mr-2 ${t.amount < 0 ? 'text-rose-400' : 'text-emerald-500'}">
                        ${t.amount > 0 ? '+' : ''}${t.amount.toLocaleString()}
                    </span>
                    
                    <!-- 📝 修正按鈕 -->
                    <button onclick="editTrans(${t.originalIndex})" class="text-slate-400 dark:text-slate-500 p-2 hover:scale-110 active:scale-90 transition">
                        📝
                    </button>
                    
                    <!-- 🗑️ 刪除按鈕 -->
                    <button onclick="deleteTrans(${t.originalIndex})" class="text-slate-200 dark:text-slate-600 p-2 hover:text-rose-400 transition">
                        🗑️
                    </button>
                </div>
            </div>`).join('');
    }

    // --- 執行修正內容的動作 ---
    function editTrans(index) {
        const target = storage.trans[index];
        const newDesc = prompt("📝 修改 (加上🏧💰📉✨圖示可修正收支統計)：", target.desc);
        
        if (newDesc !== null && newDesc !== "") {
            saveState(); // 修正前先存檔，萬一改錯還能 ↩️ 復原
            target.desc = newDesc;
            saveAndRender();
            // 如果在明細分頁，立即刷新畫面
            if(!document.getElementById('tab-calendar').classList.contains('hidden')) {
                renderCalendar();
            }
            alert("✅ 內容已成功修正！");
        }
    }
    function deleteTrans(index) {
        if(!confirm('要刪除嗎？')) return;
        saveState(); const target = storage.trans[index];
        storage[target.acc] -= target.amount; storage.trans.splice(index, 1);
        saveAndRender(); if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
// --- 核心功能：記帳 (精準日期修正版) ---
function addTrans() {
    const desc = document.getElementById('t-desc').value;
    const amount = parseFloat(document.getElementById('t-amount').value);
    const dateInput = document.getElementById('t-date'); 
    
    if(!desc || isNaN(amount) || !dateInput.value) return alert("請輸入完整內容與日期！");

    saveState();
    
    // 💡 關鍵修正：將選取的日期字串 (YYYY-MM-DD) 轉換為系統通用的本地格式
    const selectedDate = new Date(dateInput.value);
    const dateStr = selectedDate.toLocaleDateString();

    storage[storage.selectedAcc] += amount;
    storage.trans.push({ 
        acc: storage.selectedAcc, 
        desc: desc, 
        amount: amount, 
        date: dateStr // 儲存選取的日期，而不是今天
    });

    saveAndRender();
    
    // 成功後重設輸入框，日期跳回今天
    document.getElementById('t-desc').value = '';
    document.getElementById('t-amount').value = '';
    dateInput.valueAsDate = new Date();
    
    // 如果你在明細分頁，自動跳轉到該日期查看
    if(!document.getElementById('tab-calendar').classList.contains('hidden')) {
        selectedDateStr = dateStr;
        currentViewDate = new Date(selectedDate); // 月曆自動跳到該月份
        renderCalendar();
    }
    
    alert("紀錄成功！已歸檔至 " + dateStr);
}
    function quickWithdraw() {
        const amount = parseFloat(prompt("領多少出來？")); 
        if (!amount || amount <= 0) return;
        saveState(); 
        
        // 💡 取得畫面上選取的日期，若沒選則抓今天
        const selectedDate = new Date(document.getElementById('t-date').value).toLocaleDateString();
        
        storage.wallet -= amount; storage.cash += amount;
        storage.trans.push(
            { acc: 'wallet', desc: `🏧 領出來`, amount: -amount, date: selectedDate }, 
            { acc: 'cash', desc: `🏧 領錢放口袋`, amount, date: selectedDate }
        );
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
    function quickSave() {
        const amount = parseFloat(prompt("要存多少？")); 
        if (!amount || amount <= 0) return;
        saveState(); 
        const selectedDate = new Date(document.getElementById('t-date').value).toLocaleDateString();
        
        storage.wallet -= amount; storage.savings += amount;
        storage.trans.push(
            { acc: 'wallet', desc: `💰 存起來`, amount: -amount, date: selectedDate }, 
            { acc: 'savings', desc: `💰 存預備金`, amount, date: selectedDate }
        );
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
    function quickInvest() {
        const amount = parseFloat(prompt("要轉多少錢到交割戶？")); 
        if (!amount || amount <= 0) return;
        saveState(); 
        const selectedDate = new Date(document.getElementById('t-date').value).toLocaleDateString();
        
        storage.wallet -= amount; storage.brokerage += amount;
        storage.trans.push(
            { acc: 'wallet', desc: `📉 放進去`, amount: -amount, date: selectedDate }, 
            { acc: 'brokerage', desc: `📉 進交割戶`, amount, date: selectedDate }
        );
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
    function quickToDream() {
        const amount = parseFloat(prompt("要投多少到夢想帳戶？")); 
        if (!amount || amount <= 0) return;
        saveState(); 
        const selectedDate = new Date(document.getElementById('t-date').value).toLocaleDateString();
        
        storage.wallet -= amount; storage.dream += amount;
        storage.trans.push(
            { acc: 'wallet', desc: `✨ 投夢想`, amount: -amount, date: selectedDate }, 
            { acc: 'dream', desc: `✨ 存進夢想帳戶`, amount, date: selectedDate }
        );
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
function exportData() {
    try {
        // 建立包含版本資訊的資料物件
        const dataStr = JSON.stringify({version: "V7.9", data: storage}, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
        
        // 產生自動下載連結
        const exportFileDefaultName = `Paisu_Backup_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
        
        alert("✅ 備份檔案已下載！您可以將此檔案傳至 Line 儲存。");
    } catch (e) { 
        alert("❌ 備份失敗：" + e); 
    }
}
function importData() {
    // 建立一個隱藏的檔案選擇器
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json';
    
    fileInput.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        
        reader.onload = readerEvent => {
            try {
                const content = readerEvent.target.result;
                const decoded = JSON.parse(content);
                storage = decoded.data || decoded;
                
                // 補齊可能缺失的欄位
                if (storage.dream === undefined) storage.dream = 0;
                
                saveAndRender();
                alert("✅ 檔案還原成功！");
                location.reload();
            } catch (err) {
                alert("❌ 檔案格式錯誤或損壞");
            }
        }
    }
    fileInput.click();
}    function clearHistory() { 
        if(confirm('🚨 確定要歸零清空嗎？')) {
            storage = { wallet: 0, savings: 0, brokerage: 0, cash: 0, dream: 0, trans: [], customTitle: '💎 額冷的paisu', selectedAcc: 'wallet', dreamName: '✈️ 飛向夢想', dreamTarget: 50000, darkMode: storage.darkMode, isPrivacy: storage.isPrivacy };
            saveAndRender(); location.reload();
        } 
    }

    function saveAndRender() { localStorage.setItem('perfectMaster_V7_9', JSON.stringify(storage)); renderOverview(); }
    function changeMonth(step) { currentViewDate.setMonth(currentViewDate.getMonth() + step); renderCalendar(); }

    function renderOverview() {
        document.getElementById('main-title').innerText = storage.customTitle;
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => {
            document.getElementById(`${a}-val`).innerText = `$ ${storage[a].toLocaleString()}`;
        });
        document.getElementById('dream-acc-val').innerText = `$ ${storage.dream.toLocaleString()}`;
        
        const sList = document.getElementById('stock-list'); sList.innerHTML = ''; let stockTotal = 0;
        liveStocks.forEach(s => {
            const qty = s.qty || 0; const val = s.price * qty; stockTotal += val;
            sList.innerHTML += `<tr class="border-b border-pink-50 dark:border-slate-700"><td class="py-3 font-bold">${s.name}</td><td class="text-center font-bold text-slate-500 dark:text-slate-400">${qty.toLocaleString()}</td><td class="text-right text-pink-500 dark:text-gold font-black">$${s.price.toFixed(2)}</td><td class="text-right font-black amount-val">$${Math.round(val).toLocaleString()}</td></tr>`;
        });

        const dreamVal = storage.dream || 0;
        const target = storage.dreamTarget || 1;
        const percent = Math.min(100, Math.round((dreamVal / target) * 100));
        document.getElementById('dream-name-display').innerText = storage.dreamName;
        document.getElementById('dream-val').innerText = `$ ${dreamVal.toLocaleString()}`;
        document.getElementById('dream-percent').innerText = `${percent}%達成`;
        document.getElementById('dream-bar').style.width = `${percent}%`;
        document.getElementById('dream-remain').innerText = `$ ${Math.max(0, target - dreamVal).toLocaleString()}`;
        document.getElementById('total-net-worth').innerText = `$ ${Math.round(storage.wallet + storage.savings + storage.brokerage + storage.cash + storage.dream + stockTotal).toLocaleString()}`;
        applyPrivacy();
    }

    async function fetchGoogleData() { try { const res = await fetch(GOOGLE_API_URL); liveStocks = await res.json(); renderOverview(); } catch (e) { console.error("API Error"); } }
    
    function setAcc(acc) {
        storage.selectedAcc = acc;
        const colors = { wallet: 'bg-pink-500', savings: 'bg-indigo-500', brokerage: 'bg-yellow-500', cash: 'bg-emerald-500', dream: 'bg-rose-500' };
        ['wallet', 'savings', 'brokerage', 'cash', 'dream'].forEach(a => {
            const btn = document.getElementById(`btn-${a}`);
            btn.className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition min-w-[60px] ${a === acc ? colors[a] + ' text-white shadow-md' : 'text-slate-400'}`;
        });
    }

    applyPrivacy(); setAcc(storage.selectedAcc || 'wallet'); fetchGoogleData(); renderOverview();
</script>
