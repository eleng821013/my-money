<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>額冷的Paisu V7.8 PrivacyGold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gold: '#fbbf24' } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com');
        body { transition: background-color 0.3s, color 0.3s; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --bg-body: #fff5f7; --card-bg: white; --card-border: #fce7f3; --text-main: #334155; }
        .dark { --bg-body: #0f172a; --card-bg: #1e293b; --card-border: #334155; --text-main: #f1f5f9; }

        body { background-color: var(--bg-body); color: var(--text-main); }
        .glass-card { background-color: var(--card-bg); border-radius: 1.5rem; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        /* 隱私遮蓋樣式 */
        .privacy-active .amount-val { position: relative; color: transparent !important; text-shadow: 0 0 12px rgba(148, 163, 184, 0.8); pointer-events: none; }
        .privacy-active .amount-val::before { content: '****'; position: absolute; left: 50%; transform: translateX(-50%); color: var(--text-main); text-shadow: none; letter-spacing: 2px; font-weight: 900; }
        .dark.privacy-active .amount-val::before { color: #fbbf24; }
        .text-right.privacy-active .amount-val::before { left: auto; right: 0; transform: none; }

        .btn-pink { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); color: white; font-weight: 900; }
        .dark .btn-pink { background: linear-gradient(135deg, #b45309 0%, #fbbf24 100%); color: #451a03; }
        .btn-action { background: #fdf2f8; border: 1.5px dashed #f472b6; color: #db2777; }
        .dark .btn-action { background: #1e293b; border: 1.5px dashed #fbbf24; color: #fbbf24; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); height: 75px; display: flex; align-items: center; border-top: 1px solid var(--card-border); z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; transition: 0.3s; }
        .nav-item.active { color: #f472b6; transform: translateY(-2px); }
        .dark .nav-item.active { color: #fbbf24; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0.75rem; position: relative; font-size: 0.85rem; font-weight: 700; }
        .calendar-day.has-data::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; background: #f472b6; border-radius: 50%; }
        .dark .calendar-day.has-data::after { background: #fbbf24; }
        .calendar-day.selected { background: #f472b6 !important; color: white !important; }
        .dark .calendar-day.selected { background: #fbbf24 !important; color: #0f172a !important; }
    </style>
</head>
<body class="p-4">

<div class="max-w-4xl mx-auto pb-28">
    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 id="main-title" class="text-2xl font-black text-pink-500 dark:text-gold tracking-tighter">💎 額冷的paisu</h1>
            <p class="text-xs text-slate-400 dark:text-slate-300 font-bold">小資產大夢想 ‧ V7.8</p>
        </div>
        <div class="text-right">
            <div class="flex items-center justify-end gap-1 mb-1">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Net Worth</p>
                <button onclick="togglePrivacy()" id="privacy-btn" class="text-xs filter grayscale hover:grayscale-0 transition active:scale-90">👁️</button>
            </div>
            <p id="total-net-worth" class="text-xl font-black text-slate-700 dark:text-white amount-val">$ 0</p>
        </div>
    </header>

    <main>
        <!-- 分頁 1: 👛 資產 -->
        <section id="tab-home" class="space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-black text-pink-500 dark:text-gold text-sm">📈 投資市值</h2>
                    <a href="https://docs.google.com/spreadsheets/d/1sSJsUmdTPTF4Wh9hcGO0p-5hMSrbPCgGBhnBYR-Z2PQ/edit?usp=sharing" target="_blank" class="text-[10px] bg-slate-50 dark:bg-slate-700 text-slate-400 dark:text-slate-200 px-2 py-1 rounded-md font-bold">更新股數</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-[10px] text-left">
                        <thead>
                            <tr class="text-slate-400 dark:text-slate-300 border-b border-pink-50 dark:border-slate-700">
                                <th class="py-2 font-black">名稱</th>
                                <th class="py-2 font-black text-center">股數</th>
                                <th class="py-2 font-black text-right">市價</th>
                                <th class="py-2 font-black text-right">市值</th>
                            </tr>
                        </thead>
                        <tbody id="stock-list" class="dark:text-white"></tbody>
                    </table>
                </div>
                <button onclick="fetchGoogleData()" class="w-full mt-4 py-2 bg-pink-50 dark:bg-slate-700 text-pink-500 dark:text-gold rounded-xl text-[10px] font-bold">刷新行情</button>
            </div>

            <!-- 夢想進度區 -->
            <div class="glass-card p-5 bg-gradient-to-br from-white to-pink-50 dark:from-slate-800 dark:to-slate-900 border-pink-100 dark:border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-black text-pink-600 dark:text-gold text-sm italic">✨ <span id="dream-name-display">我的夢想</span></h2>
                    <span id="dream-percent" class="text-[10px] font-black text-white dark:text-slate-900 bg-pink-400 dark:bg-gold px-2.5 py-1 rounded-full">0%達成</span>
                </div>
                <div class="w-full bg-pink-100 dark:bg-slate-700 h-3 rounded-full overflow-hidden mb-3">
                    <div id="dream-bar" class="bg-gradient-to-r from-pink-300 to-rose-400 dark:from-amber-600 dark:to-gold h-full transition-all duration-700" style="width: 0%"></div>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-[9px] text-slate-400 dark:text-slate-300 font-bold uppercase">夢想金累計</p>
                        <p id="dream-val" class="font-black text-slate-700 dark:text-white text-xl leading-none amount-val">$ 0</p>
                    </div>
                    <div class="text-right text-[9px] text-slate-400 dark:text-slate-300 font-bold">
                        還差: <span id="dream-remain" class="text-pink-500 dark:text-gold amount-val">$ 0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="glass-card p-4 border-l-4 border-pink-400 dark:border-gold"><p class="text-[10px] text-slate-400 dark:text-slate-300 font-bold">生活</p><p id="wallet-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-indigo-400"><p class="text-[10px] text-indigo-400 font-bold">儲蓄</p><p id="savings-val" class="font-black text-indigo-600 dark:text-indigo-300 amount-val">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-yellow-400"><p class="text-[10px] text-yellow-500 font-bold">交割</p><p id="brokerage-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-emerald-400"><p class="text-[10px] text-emerald-500 font-bold">現金</p><p id="cash-val" class="font-black text-slate-700 dark:text-white amount-val">$ 0</p></div>
            </div>

            <div class="glass-card p-6 space-y-4 shadow-xl">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="quickWithdraw()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">🏧 領出來</button>
                    <button onclick="quickSave()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">💰 存起來</button>
                    <button onclick="quickInvest()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">📉 放進去</button>
                </div>
                <div class="flex gap-1.5 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button onclick="setAcc('wallet')" id="btn-wallet" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">生活</button>
                    <button onclick="setAcc('savings')" id="btn-savings" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">儲蓄</button>
                    <button onclick="setAcc('brokerage')" id="btn-brokerage" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">交割</button>
                    <button onclick="setAcc('cash')" id="btn-cash" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">現金</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="t-desc" placeholder="項目內容" class="col-span-2 bg-slate-50 dark:bg-slate-900 dark:text-white p-4 rounded-xl outline-none text-sm">
                    <input type="number" id="t-amount" placeholder="金額" class="col-span-1 bg-slate-50 dark:bg-slate-900 dark:text-white p-4 rounded-xl outline-none text-sm">
                </div>
                <button onclick="addTrans()" class="w-full btn-pink py-4 rounded-2xl shadow-lg">紀錄入帳 / 支出</button>
            </div>
        </section>

        <!-- 分頁 2: 明細 📆 -->
        <section id="tab-calendar" class="hidden space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="changeMonth(-1)" class="text-pink-300 dark:text-gold font-bold p-2">◀</button>
                    <h2 id="calendar-month" class="font-black text-slate-700 dark:text-white">月曆</h2>
                    <button onclick="changeMonth(1)" class="text-pink-300 dark:text-gold font-bold p-2">▶</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 dark:text-slate-300 mb-2 uppercase">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 px-1">
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 dark:text-slate-300 font-black uppercase mb-1">本月收入</p><p id="monthly-income" class="text-lg font-black text-emerald-500 amount-val">$ 0</p></div>
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 dark:text-slate-300 font-black uppercase mb-1">本月支出</p><p id="monthly-expense" class="text-lg font-black text-rose-400 amount-val">$ 0</p></div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center px-2">
                    <h3 id="selected-date-label" class="font-black text-slate-700 dark:text-white text-sm">日期明細</h3>
                    <button onclick="undoLastAction()" class="text-[10px] text-pink-500 dark:text-gold font-bold bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full border border-pink-100 dark:border-slate-700">↩️ 復原</button>
                </div>
                <div id="day-detail-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- 分頁 3: 設定 ⚙️ -->
        <section id="tab-settings" class="hidden space-y-6">
            <div class="glass-card p-6 space-y-6">
                <h3 class="font-black text-slate-700 dark:text-white text-sm border-b dark:border-slate-700 pb-2">🎨 個人化設定</h3>
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl">
                    <span class="font-bold text-sm">深色模式 (黑金)</span>
                    <button id="dark-toggle" onclick="toggleDarkMode()" class="w-12 h-6 bg-slate-200 dark:bg-gold rounded-full relative transition-all">
                        <div class="w-5 h-5 bg-white dark:bg-slate-900 rounded-full absolute top-0.5 left-0.5 dark:left-6.5 transition-all"></div>
                    </button>
                </div>
                <div class="space-y-4">
                    <label class="text-[10px] text-slate-400 dark:text-slate-300 font-bold block mb-1">管家名稱</label>
                    <div class="flex gap-2">
                        <input type="text" id="setting-title" class="flex-1 bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none">
                        <button onclick="updateSettings()" class="bg-pink-500 dark:bg-gold text-white dark:text-slate-900 px-4 rounded-xl text-xs font-bold">更新</button>
                    </div>
                </div>
                <h3 class="font-black text-slate-700 dark:text-white text-sm border-b dark:border-slate-700 pb-2 pt-4">🌈 夢想藍圖</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-[10px] text-slate-400 dark:text-slate-300 font-bold block mb-1">名稱</label><input type="text" id="setting-dream-name" class="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none"></div>
                    <div><label class="text-[10px] text-slate-400 dark:text-slate-300 font-bold block mb-1">目標金額</label><input type="number" id="setting-dream-target" class="w-full bg-slate-50 dark:bg-slate-900 dark:text-white p-3 rounded-xl text-sm outline-none"></div>
                </div>
                <button onclick="updateDreamSettings()" class="w-full py-3 bg-pink-500 dark:bg-gold text-white dark:text-slate-900 rounded-xl font-bold text-xs shadow-lg">儲存夢想設定</button>
            </div>
            <div class="glass-card p-6 space-y-4">
                <h3 class="font-black text-slate-700 dark:text-white text-sm border-b dark:border-slate-700 pb-2">📥 數據安全</h3>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportData()" class="w-full py-3 bg-indigo-50 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 rounded-xl font-bold text-xs px-4 flex justify-between items-center transition-all"><span>備份資料</span><i class="fas fa-copy opacity-50"></i></button>
                    <button onclick="importData()" class="w-full py-3 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold text-xs px-4 flex justify-between items-center transition-all"><span>還原資料</span><i class="fas fa-file-import opacity-50"></i></button>
                </div>
            </div>
        </section>
    </main>
</div>

<nav class="nav-bar">
    <button onclick="switchTab('home')" id="nav-home" class="nav-item active"><div class="text-xl">👛</div><span class="font-bold text-[10px]">資產</span></button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item"><div class="text-xl">📆</div><span class="font-bold text-[10px]">明細</span></button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-item"><div class="text-xl">⚙️</div><span class="font-bold text-[10px]">設定</span></button>
</nav>

<script>
    const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbziOxOkH-JDDXJSQFSn0t4_9hVto_VhBl1SauC1AAbhaavX6HF0pg7bWi85Iv-PAPPW/exec';
    let storage = JSON.parse(localStorage.getItem('perfectMaster_V5')) || { 
        wallet: 0, savings: 0, brokerage: 0, cash: 0, trans: [], 
        customTitle: '💎 額冷的paisu', selectedAcc: 'wallet',
        dreamName: '✈️ 飛向夢想', dreamTarget: 50000, darkMode: false, isPrivacy: false
    };
    let liveStocks = [], currentViewDate = new Date(), selectedDateStr = new Date().toLocaleDateString(), historyStack = [];

    if (storage.darkMode) document.documentElement.classList.add('dark');
    
    function applyPrivacy() {
        document.body.classList.toggle('privacy-active', storage.isPrivacy);
        document.getElementById('privacy-btn').innerText = storage.isPrivacy ? '🙈' : '👁️';
    }
    function togglePrivacy() { storage.isPrivacy = !storage.isPrivacy; applyPrivacy(); saveAndRender(); }
    function toggleDarkMode() { storage.darkMode = !storage.darkMode; document.documentElement.classList.toggle('dark'); saveAndRender(); }
    
    function switchTab(tab) {
        document.getElementById('tab-home').classList.toggle('hidden', tab !== 'home');
        document.getElementById('tab-calendar').classList.toggle('hidden', tab !== 'calendar');
        document.getElementById('tab-settings').classList.toggle('hidden', tab !== 'settings');
        ['home', 'calendar', 'settings'].forEach(t => document.getElementById(`nav-${t}`).classList.toggle('active', t === tab));
        if(tab === 'calendar') renderCalendar();
        if(tab === 'settings') {
            document.getElementById('setting-dream-name').value = storage.dreamName;
            document.getElementById('setting-dream-target').value = storage.dreamTarget;
        }
        window.scrollTo(0,0);
    }
    
    function updateSettings() {
        const newTitle = document.getElementById('setting-title').value;
        if(newTitle) { storage.customTitle = newTitle; saveAndRender(); alert("更新成功！✨"); }
    }
    
    function updateDreamSettings() {
        storage.dreamName = document.getElementById('setting-dream-name').value;
        storage.dreamTarget = parseFloat(document.getElementById('setting-dream-target').value) || 0;
        saveAndRender(); alert("夢想藍圖更新成功！🚀");
    }
    
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const monthLabel = document.getElementById('calendar-month');
        grid.innerHTML = '';
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        monthLabel.innerText = `${year}年 ${month + 1}月`;
        const firstDay = new Date(year, month, 1).getDay(), lastDate = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
        let income = 0, expense = 0;
        storage.trans.forEach(t => {
            const tDate = new Date(t.date);
            if(tDate.getFullYear() === year && tDate.getMonth() === month) {
                if(t.amount > 0) income += t.amount; else expense += Math.abs(t.amount);
            }
        });
        document.getElementById('monthly-income').innerText = `$ ${income.toLocaleString()}`;
        document.getElementById('monthly-expense').innerText = `$ ${expense.toLocaleString()}`;
        for (let d = 1; d <= lastDate; d++) {
            const dateStr = new Date(year, month, d).toLocaleDateString();
            const hasData = storage.trans.some(t => t.date === dateStr);
            grid.innerHTML += `<div onclick="selectDate('${dateStr}')" class="calendar-day ${hasData ? 'has-data' : ''} ${selectedDateStr === dateStr ? 'selected' : ''}">${d}</div>`;
        }
        renderDayDetail(selectedDateStr);
    }
    
    function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); }
    
    function renderDayDetail(dateStr) {
        document.getElementById('selected-date-label').innerText = `${dateStr} 明細`;
        const list = document.getElementById('day-detail-list');
        const dayTrans = storage.trans.map((t, idx) => ({...t, originalIndex: idx})).filter(t => t.date === dateStr);
        list.innerHTML = dayTrans.length === 0 ? `<div class="glass-card p-10 text-center text-slate-400 text-xs font-bold">🍵 休息日</div>` : 
            dayTrans.reverse().map(t => `<div class="glass-card p-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-[9px] font-black text-slate-400 uppercase">${t.acc.substring(0,1)}</div>
                    <div><p class="font-bold text-xs text-slate-600 dark:text-slate-100">${t.desc}</p><p class="text-[9px] text-slate-300 font-black uppercase">${t.acc}</p></div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-black text-sm amount-val ${t.amount < 0 ? 'text-rose-400' : 'text-emerald-500'}">${t.amount > 0 ? '+' : ''}${t.amount.toLocaleString()}</span>
                    <button onclick="deleteTrans(${t.originalIndex})" class="text-slate-200 dark:text-slate-500 p-2">🗑️</button>
                </div>
            </div>`).join('');
    }
    
    function saveState() { if (historyStack.length > 20) historyStack.shift(); historyStack.push(JSON.stringify(storage)); }
    function undoLastAction() {
        if (historyStack.length === 0) return alert("無法復原囉！");
        storage = JSON.parse(historyStack.pop()); saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
    
    function deleteTrans(index) {
        if(!confirm('要刪除嗎？')) return;
        saveState(); const target = storage.trans[index];
        storage[target.acc] -= target.amount; storage.trans.splice(index, 1);
        saveAndRender(); if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }
    
    function addTrans() {
        const desc = document.getElementById('t-desc').value, amount = parseFloat(document.getElementById('t-amount').value);
        if(!desc || isNaN(amount)) return;
        saveState(); storage[storage.selectedAcc] += amount;
        storage.trans.push({ acc: storage.selectedAcc, desc, amount, date: new Date().toLocaleDateString() });
        saveAndRender(); document.getElementById('t-desc').value = ''; document.getElementById('t-amount').value = '';
    }
    
    function quickWithdraw() {
        const amount = parseFloat(prompt("領多少出來？")); if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.cash += amount;
        storage.trans.push({ acc: 'wallet', desc: `🏧 領出來`, amount: -amount, date: today }, { acc: 'cash', desc: `🏧 領錢存入`, amount, date: today });
        saveAndRender();
    }
    
    function quickSave() {
        const amount = parseFloat(prompt("要存多少？")); if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.savings += amount;
        storage.trans.push({ acc: 'wallet', desc: `💰 存起來`, amount: -amount, date: today }, { acc: 'savings', desc: `💰 定存`, amount, date: today });
        saveAndRender();
    }
    
    function quickInvest() {
        const amount = parseFloat(prompt("要轉多少錢到交割戶？")); if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.brokerage += amount;
        storage.trans.push({ acc: 'wallet', desc: `📉 放進去`, amount: -amount, date: today }, { acc: 'brokerage', desc: `📉 交割`, amount, date: today });
        saveAndRender();
    }
    
    function saveAndRender() { localStorage.setItem('perfectMaster_V5', JSON.stringify(storage)); renderOverview(); }
    function changeMonth(step) { currentViewDate.setMonth(currentViewDate.getMonth() + step); renderCalendar(); }
    
    function renderOverview() {
        document.getElementById('main-title').innerText = storage.customTitle;
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => document.getElementById(`${a}-val`).innerText = `$ ${storage[a].toLocaleString()}`);
        const sList = document.getElementById('stock-list'); sList.innerHTML = ''; let stockTotal = 0;
        liveStocks.forEach(s => {
            const qty = s.qty || 0; const val = s.price * qty; stockTotal += val;
            sList.innerHTML += `<tr class="border-b border-pink-50 dark:border-slate-700">
                <td class="py-3 font-bold">${s.name}</td>
                <td class="text-center font-bold text-slate-500 dark:text-slate-400">${qty.toLocaleString()}</td>
                <td class="text-right text-pink-500 dark:text-gold font-black">$${s.price.toFixed(2)}</td>
                <td class="text-right font-black amount-val">$${Math.round(val).toLocaleString()}</td></tr>`;
        });
        const dreamVal = Math.max(0, storage.savings - (storage.dreamSafe || 0));
        const target = storage.dreamTarget || 1;
        const percent = Math.min(100, Math.round((dreamVal / target) * 100));
        document.getElementById('dream-name-display').innerText = storage.dreamName;
        document.getElementById('dream-val').innerText = `$ ${dreamVal.toLocaleString()}`;
        document.getElementById('dream-percent').innerText = `${percent}%達成`;
        document.getElementById('dream-bar').style.width = `${percent}%`;
        document.getElementById('dream-remain').innerText = `$ ${Math.max(0, target - dreamVal).toLocaleString()}`;
        document.getElementById('total-net-worth').innerText = `$ ${Math.round(storage.wallet + storage.savings + storage.brokerage + storage.cash + stockTotal).toLocaleString()}`;
        applyPrivacy();
    }

    async function fetchGoogleData() { 
        try { 
            const res = await fetch(GOOGLE_API_URL); 
            liveStocks = await res.json(); 
            renderOverview(); 
        } catch (e) { 
            console.error("API Error"); 
        } 
    }
    
    function setAcc(acc) {
        storage.selectedAcc = acc;
        const colors = { 
            wallet: storage.darkMode ? 'bg-amber-500' : 'bg-pink-500', 
            savings: 'bg-indigo-500', 
            brokerage: storage.darkMode ? 'bg-slate-600' : 'bg-slate-800', 
            cash: 'bg-emerald-500' 
        };
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => {
            const btn = document.getElementById(`btn-${a}`);
            btn.className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition ${a === acc ? colors[a] + ' text-white shadow-md' : 'text-slate-400'}`;
        });
    }

    function exportData() {
        const encoded = btoa(encodeURIComponent(JSON.stringify(storage)));
        const dummy = document.createElement("textarea"); 
        document.body.appendChild(dummy); 
        dummy.value = encoded; 
        dummy.select(); 
        document.execCommand("copy"); 
        document.body.removeChild(dummy);
        alert("備份已複製！");
    }

    function importData() { 
        const code = prompt("請貼上代碼："); 
        if(code) { 
            try { 
                storage = JSON.parse(decodeURIComponent(atob(code))); 
                if (storage.darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                saveAndRender(); 
                alert("資料已還原！"); 
            } catch(e) { 
                alert("代碼錯誤！"); 
            } 
        } 
    }

    // 初始執行
    applyPrivacy();
    setAcc(storage.selectedAcc || 'wallet'); 
    fetchGoogleData(); 
    renderOverview();
</script>
</body>
</html>
