<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>額冷的Paisu V5.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com');
        body { background: #fff5f7; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(244, 114, 182, 0.1); border: 1px solid #fce7f3; }
        .btn-pink { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); transition: all 0.3s ease; color: white; font-weight: 900; }
        .btn-pink:active { transform: scale(0.96); }
        .btn-action { background: #fdf2f8; border: 1.5px dashed #f472b6; color: #db2777; }
        /* 導航欄樣式 */
        .nav-item { color: #cbd5e1; transition: all 0.3s; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .nav-item.active { color: #ec4899; }
        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 10px; font-weight: 900; }
        /* 月曆樣式 */
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0.75rem; position: relative; font-size: 0.8rem; font-weight: 700; }
        .calendar-day.has-data::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: #ec4899; border-radius: 50%; }
        .calendar-day.selected { background: #ec4899 !important; color: white !important; }
    </style>
</head>
<body class="p-3 md:p-8">

<div class="max-w-6xl mx-auto pb-24">
    <header class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-center md:text-left">
            <div class="flex items-center justify-center md:justify-start gap-2 mb-1">
                <h1 class="text-2xl md:text-3xl font-black text-pink-500 tracking-tighter">💎 額冷的paisu</h1>
                <a href="https://docs.google.com/spreadsheets/d/1sSJsUmdTPTF4Wh9hcGO0p-5hMSrbPCgGBhnBYR-Z2PQ/edit?usp=sharing" target="_blank" 
                   class="bg-white border border-pink-200 text-pink-400 px-2 py-1 rounded-full text-[10px] font-bold shadow-sm">
                   <i class="fas fa-edit mr-1"></i> 更新股數
                </a>
            </div>
            <p id="total-net-worth" class="text-2xl font-black text-slate-800 tracking-tighter">$ 0</p>
        </div>
    </header>

    <main id="content-area">
        <!-- 分頁 1: 總覽與記帳 -->
        <section id="tab-home" class="space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-black text-pink-600"><i class="fas fa-chart-line mr-2"></i>投資市值</h2>
                    <button onclick="fetchGoogleData()" class="text-[10px] bg-pink-50 text-pink-500 px-3 py-1.5 rounded-full font-bold">刷新行情</button>
                </div>
                <div class="overflow-x-auto text-sm">
                    <table class="w-full text-left border-collapse">
                        <tbody id="stock-list"></tbody>
                    </table>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="glass-card p-3 border-l-4 border-pink-400"><p class="text-[10px] text-slate-400 font-bold">生活帳戶</p><p id="wallet-val" class="font-black text-slate-700">$ 0</p></div>
                <div class="glass-card p-3 border-l-4 border-indigo-400"><p class="text-[10px] text-indigo-400 font-bold">儲蓄帳戶</p><p id="savings-val" class="font-black text-indigo-600">$ 0</p></div>
                <div class="glass-card p-3 border-l-4 border-yellow-400"><p class="text-[10px] text-yellow-500 font-bold">證券交割</p><p id="brokerage-val" class="font-black text-slate-700">$ 0</p></div>
                <div class="glass-card p-3 border-l-4 border-emerald-400"><p class="text-[10px] text-emerald-500 font-bold">口袋現金</p><p id="cash-val" class="font-black text-slate-700">$ 0</p></div>
            </div>

            <div class="glass-card p-6 space-y-4 shadow-xl">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="quickWithdraw()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold"><i class="fas fa-bolt mr-1"></i> ATM 提款</button>
                    <button onclick="quickSave()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold"><i class="fas fa-piggy-bank mr-1"></i> 💰 存起來</button>
                </div>
                <div class="flex gap-1.5 p-1 bg-slate-100 rounded-xl">
                    <button onclick="setAcc('wallet')" id="btn-wallet" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">生活</button>
                    <button onclick="setAcc('savings')" id="btn-savings" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">儲蓄</button>
                    <button onclick="setAcc('brokerage')" id="btn-brokerage" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">交割</button>
                    <button onclick="setAcc('cash')" id="btn-cash" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">現金</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="t-desc" placeholder="做什麼呢？" class="col-span-2 bg-slate-50 p-4 rounded-xl outline-none text-sm">
                    <input type="number" id="t-amount" placeholder="金額" class="col-span-1 bg-slate-50 p-4 rounded-xl outline-none text-sm">
                </div>
                <button onclick="addTrans()" class="w-full btn-pink py-4 rounded-xl shadow-lg">紀錄入帳 / 支出</button>
            </div>
        </section>

        <!-- 分頁 2: 歷史月曆 -->
        <section id="tab-calendar" class="hidden space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="text-pink-500 p-2"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="calendar-month" class="font-black text-slate-700">2024年 10月</h2>
                    <button onclick="changeMonth(1)" class="text-pink-500 p-2"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
            </div>

            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="selected-date-label" class="font-black text-slate-700 text-sm">日期明細</h3>
                    <button onclick="undoLastAction()" class="text-[10px] text-indigo-500 font-bold"><i class="fas fa-undo mr-1"></i> 復原</button>
                </div>
                <div id="day-detail-list" class="space-y-3"></div>
            </div>

            <div class="glass-card p-5 bg-slate-50/50">
                <p class="text-[10px] text-slate-400 font-bold text-center mb-3">數據管理中心</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="exportData()" class="py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg font-bold text-[10px]">📥 備份</button>
                    <button onclick="importData()" class="py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg font-bold text-[10px]">📤 還原</button>
                    <button onclick="clearHistory()" class="py-2.5 bg-white border border-rose-100 text-rose-300 rounded-lg font-bold text-[10px]">🗑️ 清空</button>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- 底部導航欄：更換為錢包圖示 -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-pink-100 flex justify-around items-center h-20 px-6 z-50 shadow-[0_-5px_20px_rgba(244,114,182,0.1)]">
    <button onclick="switchTab('home')" id="nav-home" class="nav-item active">
        <i class="fas fa-wallet"></i>
        <span>總覽</span>
    </button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item">
        <i class="fas fa-calendar-alt"></i>
        <span>明細</span>
    </button>
</nav>

<script>
    const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbziOxOkH-JDDXJSQFSn0t4_9hVto_VhBl1SauC1AAbhaavX6HF0pg7bWi85Iv-PAPPW/exec';
    
    let storage;
    const newData = localStorage.getItem('perfectMaster_V5');
    const oldData = localStorage.getItem('perfectMaster_V4');

    if (!newData && oldData) {
        storage = JSON.parse(oldData);
        storage.trans = storage.trans.map(t => ({ ...t, date: t.date || new Date().toLocaleDateString() }));
        localStorage.setItem('perfectMaster_V5', JSON.stringify(storage));
    } else {
        storage = JSON.parse(newData) || { wallet: 0, savings: 0, brokerage: 0, cash: 0, trans: [] };
    }

    let liveStocks = [], currentViewDate = new Date(), selectedDateStr = new Date().toLocaleDateString(), historyStack = [];

    function switchTab(tab) {
        document.getElementById('tab-home').classList.toggle('hidden', tab !== 'home');
        document.getElementById('tab-calendar').classList.toggle('hidden', tab !== 'calendar');
        document.getElementById('nav-home').classList.toggle('active', tab === 'home');
        document.getElementById('nav-calendar').classList.toggle('active', tab === 'calendar');
        window.scrollTo(0, 0);
        if(tab === 'calendar') renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const monthLabel = document.getElementById('calendar-month');
        grid.innerHTML = '';
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        monthLabel.innerText = `${year}年 ${month + 1}月`;
        const firstDay = new Date(year, month, 1).getDay(), lastDate = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
        for (let d = 1; d <= lastDate; d++) {
            const dateStr = new Date(year, month, d).toLocaleDateString();
            const hasData = storage.trans.some(t => t.date === dateStr);
            grid.innerHTML += `<div onclick="selectDate('${dateStr}')" class="calendar-day ${hasData ? 'has-data' : ''} ${selectedDateStr === dateStr ? 'selected' : ''}">${d}</div>`;
        }
        renderDayDetail(selectedDateStr);
    }

    function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); }

    function renderDayDetail(dateStr) {
        document.getElementById('selected-date-label').innerText = `${dateStr} 明細`;
        const list = document.getElementById('day-detail-list');
        const dayTrans = storage.trans.filter(t => t.date === dateStr);
        list.innerHTML = dayTrans.length === 0 ? `<p class="text-center text-slate-300 py-10 text-xs font-bold">這天沒有紀錄唷 🍵</p>` : 
            dayTrans.map(t => `<div class="flex justify-between items-center p-4 bg-slate-50 rounded-xl"><div><p class="font-bold text-xs text-slate-600">${t.desc}</p><p class="text-[9px] text-slate-400 uppercase font-black">${t.acc}</p></div><span class="font-black text-sm ${t.amount < 0 ? 'text-rose-400' : 'text-emerald-500'}">${t.amount.toLocaleString()}</span></div>`).join('');
    }

    function changeMonth(step) { currentViewDate.setMonth(currentViewDate.getMonth() + step); renderCalendar(); }

    function addTrans() {
        const desc = document.getElementById('t-desc').value, amount = parseFloat(document.getElementById('t-amount').value);
        if(!desc || isNaN(amount)) return;
        saveState();
        storage[storage.selectedAcc] += amount;
        storage.trans.push({ acc: storage.selectedAcc, desc, amount, date: new Date().toLocaleDateString() });
        saveAndRender();
        document.getElementById('t-desc').value = ''; document.getElementById('t-amount').value = '';
    }

    function quickWithdraw() {
        const amount = parseFloat(prompt("提款金額 (生活 -> 現金)："));
        if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.cash += amount;
        storage.trans.push({ acc: 'wallet', desc: `🏧 提款`, amount: -amount, date: today }, { acc: 'cash', desc: `🏧 提款存入`, amount, date: today });
        saveAndRender();
    }

    function quickSave() {
        const amount = parseFloat(prompt("要存多少錢呢？ (生活 -> 儲蓄)："));
        if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.savings += amount;
        storage.trans.push({ acc: 'wallet', desc: `💰 存起來`, amount: -amount, date: today }, { acc: 'savings', desc: `💰 定存`, amount, date: today });
        saveAndRender();
    }

    function saveState() { if (historyStack.length > 10) historyStack.shift(); historyStack.push(JSON.stringify(storage)); }
    function undoLastAction() { if (historyStack.length === 0) return alert("沒有紀錄可以復原唷！"); storage = JSON.parse(historyStack.pop()); saveAndRender(); }
    function saveAndRender() { localStorage.setItem('perfectMaster_V5', JSON.stringify(storage)); renderOverview(); if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar(); }

    function renderOverview() {
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => document.getElementById(`${a}-val`).innerText = `$ ${storage[a].toLocaleString()}`);
        const sList = document.getElementById('stock-list'); sList.innerHTML = ''; let stockTotal = 0;
        liveStocks.forEach(s => {
            const val = s.price * s.qty; stockTotal += val;
            sList.innerHTML += `<tr class="border-b border-pink-50 text-[12px]"><td class="py-4 font-bold text-slate-700">${s.name}</td><td class="text-right text-pink-500 font-black">$${s.price.toFixed(2)}</td><td class="text-right font-black text-slate-700">$${Math.round(val).toLocaleString()}</td></tr>`;
        });
        document.getElementById('total-net-worth').innerText = `$ ${Math.round(storage.wallet + storage.savings + storage.brokerage + storage.cash + stockTotal).toLocaleString()}`;
    }

    async function fetchGoogleData() { try { const res = await fetch(GOOGLE_API_URL); liveStocks = await res.json(); renderOverview(); } catch (e) { console.error("API Error"); } }
    function setAcc(acc) {
        storage.selectedAcc = acc;
        const colors = { wallet:'bg-pink-500', savings:'bg-indigo-500', brokerage:'bg-slate-800', cash:'bg-emerald-500' };
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => {
            const btn = document.getElementById(`btn-${a}`);
            btn.className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition ${a === acc ? colors[a] + ' text-white shadow-md' : 'text-slate-400'}`;
        });
    }

    function exportData() {
        const encoded = btoa(encodeURIComponent(JSON.stringify(storage)));
        const dummy = document.createElement("textarea"); document.body.appendChild(dummy); dummy.value = encoded; dummy.select(); document.execCommand("copy"); document.body.removeChild(dummy);
        alert("備份代碼已複製！請妥善保存唷 💖");
    }
    function importData() { const code = prompt("請貼上備份代碼："); if(code) { storage = JSON.parse(decodeURIComponent(atob(code))); saveAndRender(); alert("資料已成功還原！"); } }
    function clearHistory() { if(confirm('確定要清空所有資料嗎？這將無法恢復。')) { storage = { wallet:0, savings:0, brokerage:0, cash:0, trans:[] }; saveAndRender(); } }

    setAcc('wallet'); fetchGoogleData(); renderOverview();
</script>
</body>
</html>
