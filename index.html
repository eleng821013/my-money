<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>額冷的Paisu V7.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com');
        body { background: #fff5f7; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(244, 114, 182, 0.1); border: 1px solid #fce7f3; }
        .btn-pink { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); transition: all 0.3s ease; color: white; font-weight: 900; }
        .btn-action { background: #fdf2f8; border: 1.5px dashed #f472b6; color: #db2777; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; height: 75px; display: flex; align-items: center; border-top: 1px solid #fce7f3; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; transition: 0.3s; }
        .nav-item.active { color: #f472b6; transform: translateY(-2px); }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 0.75rem; position: relative; font-size: 0.85rem; font-weight: 700; }
        .calendar-day.has-data::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; background: #f472b6; border-radius: 50%; }
        .calendar-day.selected { background: #f472b6 !important; color: white !important; }
    </style>
</head>
<body class="p-4">

<div class="max-w-4xl mx-auto pb-28">
    <header class="mb-6 flex justify-between items-end">
        <div>
            <h1 id="main-title" class="text-2xl font-black text-pink-500 tracking-tighter">💎 額冷的paisu</h1>
            <p class="text-xs text-slate-400 font-bold">小資產大夢想 ‧ V7.5</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Net Worth</p>
            <p id="total-net-worth" class="text-xl font-black text-slate-700">$ 0</p>
        </div>
    </header>

    <main>
        <!-- 分頁 1: 👛 資產 -->
        <section id="tab-home" class="space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-black text-pink-500 text-sm">📈 投資市值</h2>
                    <a href="https://docs.google.com/spreadsheets/d/1sSJsUmdTPTF4Wh9hcGO0p-5hMSrbPCgGBhnBYR-Z2PQ/edit?usp=sharing" target="_blank" class="text-[10px] bg-slate-50 text-slate-400 px-2 py-1 rounded-md font-bold">更新股數</a>
                </div>
                <div class="overflow-x-auto"><table class="w-full text-xs text-left"><tbody id="stock-list"></tbody></table></div>
                <button onclick="fetchGoogleData()" class="w-full mt-4 py-2 bg-pink-50 text-pink-500 rounded-xl text-[10px] font-bold">刷新行情</button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="glass-card p-4 border-l-4 border-pink-400"><p class="text-[10px] text-slate-400 font-bold">生活</p><p id="wallet-val" class="font-black text-slate-700">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-indigo-400"><p class="text-[10px] text-indigo-400 font-bold">儲蓄</p><p id="savings-val" class="font-black text-indigo-600">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-yellow-400"><p class="text-[10px] text-yellow-500 font-bold">交割</p><p id="brokerage-val" class="font-black text-slate-700">$ 0</p></div>
                <div class="glass-card p-4 border-l-4 border-emerald-400"><p class="text-[10px] text-emerald-500 font-bold">現金</p><p id="cash-val" class="font-black text-slate-700">$ 0</p></div>
            </div>

            <div class="glass-card p-6 space-y-4 shadow-xl">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="quickWithdraw()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">🏧 領出來</button>
                    <button onclick="quickSave()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">💰 存起來</button>
                    <button onclick="quickInvest()" class="btn-action py-2.5 rounded-xl text-[10px] font-bold">📉 放進去</button>
            </div>
                <div class="flex gap-1.5 p-1 bg-slate-100 rounded-xl">
                    <button onclick="setAcc('wallet')" id="btn-wallet" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">生活</button>
                    <button onclick="setAcc('savings')" id="btn-savings" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">儲蓄</button>
                    <button onclick="setAcc('brokerage')" id="btn-brokerage" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">交割</button>
                    <button onclick="setAcc('cash')" id="btn-cash" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition">現金</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="t-desc" placeholder="項目內容" class="col-span-2 bg-slate-50 p-4 rounded-xl outline-none text-sm">
                    <input type="number" id="t-amount" placeholder="金額" class="col-span-1 bg-slate-50 p-4 rounded-xl outline-none text-sm">
                </div>
                <button onclick="addTrans()" class="w-full btn-pink py-4 rounded-2xl shadow-lg">紀錄入帳 / 支出</button>
            </div>
        </section>

        <!-- 分頁 2: 明細 📆 -->
        <section id="tab-calendar" class="hidden space-y-6">
            <div class="glass-card p-5">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="changeMonth(-1)" class="text-pink-300 font-bold p-2">◀</button>
                    <h2 id="calendar-month" class="font-black text-slate-700">月曆</h2>
                    <button onclick="changeMonth(1)" class="text-pink-300 font-bold p-2">▶</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 px-1">
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 font-black uppercase mb-1">本月收入</p><p id="monthly-income" class="text-lg font-black text-emerald-500">$ 0</p></div>
                <div class="glass-card p-4"><p class="text-[9px] text-slate-400 font-black uppercase mb-1">本月支出</p><p id="monthly-expense" class="text-lg font-black text-rose-400">$ 0</p></div>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-2">
                    <h3 id="selected-date-label" class="font-black text-slate-700 text-sm">日期明細</h3>
                    <button onclick="undoLastAction()" class="text-[10px] text-pink-500 font-bold bg-white px-3 py-1.5 rounded-full border border-pink-100">↩️ 復原</button>
                </div>
                <div id="day-detail-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- 分頁 3: 設定 ⚙️ -->
        <section id="tab-settings" class="hidden space-y-6">
            <div class="glass-card p-6 space-y-6">
                <h3 class="font-black text-slate-700 text-sm border-b pb-2">⚙️ 個人化設定</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-slate-400 font-bold block mb-1">自訂管家名稱</label>
                        <div class="flex gap-2">
                            <input type="text" id="setting-title" placeholder="例如：我的小金庫" class="flex-1 bg-slate-50 p-3 rounded-xl text-sm outline-none">
                            <button onclick="updateSettings()" class="bg-pink-500 text-white px-4 rounded-xl text-xs font-bold">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-6 space-y-4">
                <h3 class="font-black text-slate-700 text-sm border-b pb-2">📥 數據安全</h3>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportData()" class="w-full py-3 bg-indigo-50 text-indigo-600 rounded-xl font-bold text-xs text-left px-4 flex justify-between items-center">
                        <span>備份資料 (複製代碼)</span> <i class="fas fa-copy opacity-50"></i>
                    </button>
                    <button onclick="importData()" class="w-full py-3 bg-slate-50 text-slate-600 rounded-xl font-bold text-xs text-left px-4 flex justify-between items-center">
                        <span>還原資料 (貼上代碼)</span> <i class="fas fa-file-import opacity-50"></i>
                    </button>
                    <button onclick="clearHistory()" class="w-full py-3 bg-rose-50 text-rose-400 rounded-xl font-bold text-xs text-left px-4 flex justify-between items-center">
                        <span>清空所有紀錄</span> <i class="fas fa-trash-alt opacity-50"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<nav class="nav-bar">
    <button onclick="switchTab('home')" id="nav-home" class="nav-item active"><div class="text-xl">👛</div><span class="font-bold">資產</span></button>
    <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item"><div class="text-xl">📆</div><span class="font-bold">明細</span></button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-item"><div class="text-xl">⚙️</div><span class="font-bold">設定</span></button>
</nav>

<script>
    const GOOGLE_API_URL = 'https://script.google.com/macros/s/AKfycbziOxOkH-JDDXJSQFSn0t4_9hVto_VhBl1SauC1AAbhaavX6HF0pg7bWi85Iv-PAPPW/exec';
    let storage = JSON.parse(localStorage.getItem('perfectMaster_V5')) || { wallet: 0, savings: 0, brokerage: 0, cash: 0, trans: [], customTitle: '💎 額冷的paisu' };
    let liveStocks = [], currentViewDate = new Date(), selectedDateStr = new Date().toLocaleDateString(), historyStack = [];

    function switchTab(tab) {
        document.getElementById('tab-home').classList.toggle('hidden', tab !== 'home');
        document.getElementById('tab-calendar').classList.toggle('hidden', tab !== 'calendar');
        document.getElementById('tab-settings').classList.toggle('hidden', tab !== 'settings');
        ['home', 'calendar', 'settings'].forEach(t => document.getElementById(`nav-${t}`).classList.toggle('active', t === tab));
        if(tab === 'calendar') renderCalendar();
        window.scrollTo(0,0);
    }

    function updateSettings() {
        const newTitle = document.getElementById('setting-title').value;
        if(newTitle) {
            storage.customTitle = newTitle;
            document.getElementById('main-title').innerText = newTitle;
            saveAndRender();
            alert("名稱已更新！✨");
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const monthLabel = document.getElementById('calendar-month');
        grid.innerHTML = '';
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        monthLabel.innerText = `${year}年 ${month + 1}月`;
        const firstDay = new Date(year, month, 1).getDay(), lastDate = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
        
        let income = 0, expense = 0;
        storage.trans.forEach(t => {
            const tDate = new Date(t.date);
            if(tDate.getFullYear() === year && tDate.getMonth() === month) {
                if(t.amount > 0) income += t.amount;
                else expense += Math.abs(t.amount);
            }
        });
        document.getElementById('monthly-income').innerText = `$ ${income.toLocaleString()}`;
        document.getElementById('monthly-expense').innerText = `$ ${expense.toLocaleString()}`;

        for (let d = 1; d <= lastDate; d++) {
            const dateStr = new Date(year, month, d).toLocaleDateString();
            const hasData = storage.trans.some(t => t.date === dateStr);
            grid.innerHTML += `<div onclick="selectDate('${dateStr}')" class="calendar-day ${hasData ? 'has-data' : ''} ${selectedDateStr === dateStr ? 'selected' : ''}">${d}</div>`;
        }
        renderDayDetail(selectedDateStr);
    }

    function selectDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); }

    function renderDayDetail(dateStr) {
        document.getElementById('selected-date-label').innerText = `${dateStr} 明細`;
        const list = document.getElementById('day-detail-list');
        const dayTrans = storage.trans.map((t, idx) => ({...t, originalIndex: idx})).filter(t => t.date === dateStr);
        list.innerHTML = dayTrans.length === 0 ? `<div class="glass-card p-10 text-center text-slate-300 text-xs font-bold">🍵 休息日</div>` : 
            dayTrans.reverse().map(t => `<div class="glass-card p-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-[9px] font-black text-slate-400 uppercase">${t.acc}</div>
                    <div><p class="font-bold text-xs text-slate-600">${t.desc}</p><p class="text-[9px] text-slate-300 font-black uppercase">${t.acc}</p></div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-black text-sm ${t.amount < 0 ? 'text-rose-400' : 'text-emerald-500'}">${t.amount > 0 ? '+' : ''}${t.amount.toLocaleString()}</span>
                    <button onclick="deleteTrans(${t.originalIndex})" class="text-slate-200 p-2">🗑️</button>
                </div>
            </div>`).join('');
    }

    function saveState() { if (historyStack.length > 20) historyStack.shift(); historyStack.push(JSON.stringify(storage)); }
    function undoLastAction() {
        if (historyStack.length === 0) return alert("無法復原囉！");
        storage = JSON.parse(historyStack.pop());
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }

    function deleteTrans(index) {
        if(!confirm('要刪除嗎？')) return;
        saveState();
        const target = storage.trans[index];
        storage[target.acc] -= target.amount;
        storage.trans.splice(index, 1);
        saveAndRender();
        if(!document.getElementById('tab-calendar').classList.contains('hidden')) renderCalendar();
    }

    function addTrans() {
        const desc = document.getElementById('t-desc').value, amount = parseFloat(document.getElementById('t-amount').value);
        if(!desc || isNaN(amount)) return;
        saveState();
        storage[storage.selectedAcc] += amount;
        storage.trans.push({ acc: storage.selectedAcc, desc, amount, date: new Date().toLocaleDateString() });
        saveAndRender();
        document.getElementById('t-desc').value = ''; document.getElementById('t-amount').value = '';
    }

    function quickWithdraw() {
        const amount = parseFloat(prompt("領多少出來？"));
        if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.cash += amount;
        storage.trans.push({ acc: 'wallet', desc: `🏧 領出來`, amount: -amount, date: today }, { acc: 'cash', desc: `🏧 領錢存入`, amount, date: today });
        saveAndRender();
    }

    function quickSave() {
        const amount = parseFloat(prompt("要存多少？"));
        if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.savings += amount;
        storage.trans.push({ acc: 'wallet', desc: `💰 存起來`, amount: -amount, date: today }, { acc: 'savings', desc: `💰 定存`, amount, date: today });
        saveAndRender();
    }

    function quickInvest() {
        const amount = parseFloat(prompt("要轉多少錢到交割戶？"));
        if (!amount || amount <= 0) return;
        saveState(); const today = new Date().toLocaleDateString();
        storage.wallet -= amount; storage.brokerage += amount;
        storage.trans.push({ acc: 'wallet', desc: `📉 放進去(轉出)`, amount: -amount, date: today }, { acc: 'brokerage', desc: `📉 放進去(交割)`, amount, date: today });
        saveAndRender();
    }

    function saveAndRender() { localStorage.setItem('perfectMaster_V5', JSON.stringify(storage)); renderOverview(); }
    function changeMonth(step) { currentViewDate.setMonth(currentViewDate.getMonth() + step); renderCalendar(); }

    function renderOverview() {
        document.getElementById('main-title').innerText = storage.customTitle || '💎 額冷的paisu';
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => document.getElementById(`${a}-val`).innerText = `$ ${storage[a].toLocaleString()}`);
        const sList = document.getElementById('stock-list'); sList.innerHTML = ''; let stockTotal = 0;
        liveStocks.forEach(s => {
            const val = s.price * s.qty; stockTotal += val;
            sList.innerHTML += `<tr class="border-b border-pink-50"><td class="py-3 font-bold text-slate-700">${s.name}</td><td class="text-right text-pink-500 font-black">$${s.price.toFixed(2)}</td><td class="text-right font-black text-slate-700">$${Math.round(val).toLocaleString()}</td></tr>`;
        });
        document.getElementById('total-net-worth').innerText = `$ ${Math.round(storage.wallet + storage.savings + storage.brokerage + storage.cash + stockTotal).toLocaleString()}`;
    }

    async function fetchGoogleData() { try { const res = await fetch(GOOGLE_API_URL); liveStocks = await res.json(); renderOverview(); } catch (e) { console.error("API Error"); } }
    function setAcc(acc) {
        storage.selectedAcc = acc;
        const colors = { wallet:'bg-pink-500', savings:'bg-indigo-500', brokerage:'bg-slate-800', cash:'bg-emerald-500' };
        ['wallet', 'savings', 'brokerage', 'cash'].forEach(a => {
            const btn = document.getElementById(`btn-${a}`);
            btn.className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition ${a === acc ? colors[a] + ' text-white shadow-md' : 'text-slate-400'}`;
        });
    }

    function exportData() {
        const encoded = btoa(encodeURIComponent(JSON.stringify(storage)));
        const dummy = document.createElement("textarea"); document.body.appendChild(dummy); dummy.value = encoded; dummy.select(); document.execCommand("copy"); document.body.removeChild(dummy);
        alert("備份已複製！");
    }
    function importData() { const code = prompt("請貼上代碼："); if(code) { storage = JSON.parse(decodeURIComponent(atob(code))); saveAndRender(); alert("資料已還原！"); } }
    function clearHistory() { if(confirm('確定要清空？')) { storage = { wallet:0, savings:0, brokerage:0, cash:0, trans:[], customTitle: '💎 額冷的paisu' }; saveAndRender(); } }

    setAcc('wallet'); fetchGoogleData(); renderOverview();
</script>
</body>
</html>
